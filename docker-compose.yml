services:
  # Service pour l'application Spring Boot
  app:
    build: .
    container_name: helping-yourself-app
    network_mode: "host"
    ports:
      - "8080:8080"
    env_file :
      - .env


    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

    # Santé de l'app
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
